name: Pull request validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  call-workflow:
    permissions:
      contents: read
    strategy:
      matrix:
        switch: [current, react-16, react-17, react-18]
    # Pinned to the version used by v4.0.0. Newer versions require "packages/test-harness", exact "localPeerDependencies" and
    # a matching "repository.url". Unpin after running "Bump scaffold".
    uses: compulim/workflows/.github/workflows/pull-request-validation.yml@d68910fa1aafefb65ce177cef29612ff14ec320c
    with:
      package-name: react-film
      skip-integration-test: false
      switch: ${{ matrix.switch }}
